<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>직각삼각형 5공식</title>
<style>
/* ───────────────────────────────────────────────
   색·글꼴 — 바꾸고 싶으면 이 :root 값만 고치면 됩니다.
   (삼각형 색은 아래 <script>의 설정 영역 COLORS에서 바꿉니다)
   ─────────────────────────────────────────────── */
:root{
  --paper:#fbfaf6;      /* 노트 종이 배경 */
  --ink:#1f2328;        /* 기본 글씨 */
  --muted:#6b7280;      /* 보조 글씨 */
  --line:#e6e2d6;       /* 구분선·테두리 */
  --rule:#eef1f6;       /* 노트 줄 */
  --card:#ffffff;
  --accent:#1f4fd1;     /* 버튼 강조 */
  --ok:#15803d;
  --ok-bg:#e8f6ec;
  --bad:#c2410c;
  --bad-bg:#fdf0e8;
  --marker:#ffd84d;     /* 형광펜(변 강조) */
  --angle:#e11d48;      /* 각 강조 */
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.55;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation; /* 더블탭 확대 방지 */
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
/* 문자(a, b, c, x, y, h)는 교과서처럼 기울임 세리프 */
i.v{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.12em;padding:0 .04em}
sup{font-size:.68em;line-height:0}
.ol{text-decoration:overline;text-decoration-thickness:1.5px} /* 선분 기호 */
.hidden{display:none!important}

/* ── 공통 레이아웃 ── */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}

/* ── 시작 화면 ── */
.title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.subtitle{color:var(--muted);margin:0 0 14px;font-size:15px}
.seg{display:flex;background:#eef0f4;border-radius:12px;padding:4px;margin:14px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:15px;margin-top:6px}
.mlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mitem{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:14px}
.mnum{flex:none;width:34px;height:34px;border-radius:50%;background:#eef2ff;color:var(--accent);display:grid;place-items:center;font-weight:800}
.mitem .f{font-size:20px;font-weight:700}
.mitem .s{font-size:13px;color:var(--muted)}
.mitem .st{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}
.mitem.done{border-color:#b7e2c4;background:#f6fcf8}
.mitem.done .mnum{background:var(--ok);color:#fff}
.mitem.done .st{color:var(--ok)}
.mitem.locked{opacity:.55}

/* ── 미션 화면 ── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,250,246,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.back{border:0;background:transparent;font-size:22px;width:44px;height:44px;border-radius:10px}
.topbar .t{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-size:14px;color:var(--muted);font-weight:600}
.pbar{height:4px;background:var(--line)}
.pbar>div{height:100%;background:var(--accent);transition:width .3s}

.mbody{max-width:560px;margin:0 auto;padding:10px 16px 24px}
.figbox{position:sticky;top:61px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px 4px;margin-bottom:12px}
.figbox svg{display:block;width:100%;height:auto;max-height:30vh}
.fighint{text-align:center;font-size:13px;font-weight:700;color:#9a6b00;padding-bottom:2px}
body.tv .fighint{font-size:18px}
.legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:24px;padding-bottom:2px}
.chip{font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;color:#fff}

.stephead{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}
.q{font-size:18px;font-weight:600;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:18px;min-height:52px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.tmpl{font-size:24px;text-align:center;margin:6px 0 14px;line-height:1.8}
.blank{display:inline-block;min-width:64px;padding:0 10px;border:2px dashed var(--accent);border-radius:10px;background:#f4f7ff;min-height:1.6em;vertical-align:middle;line-height:1.5}
.blank.filled{border-style:solid}
.blank.right{border-color:var(--ok);background:var(--ok-bg)}
.blank.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:vertical;background:#fff}
.cmp{display:grid;grid-template-columns:1fr;gap:8px;margin:4px 0 12px}
.cmp .box{border-radius:12px;padding:10px 12px;font-size:16px}
.cmp .mine{background:#f3f4f6;white-space:pre-wrap}
.cmp .model{background:#eef6ff;border:1px solid #cfe0fb}
.cmp .lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}

.fb{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-weight:600;font-size:16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:#eef2ff;color:var(--accent)}
.hints{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.hint{background:#fff8e1;border:1px solid #f4dd8e;border-radius:12px;padding:9px 12px;font-size:15px}
.hint b{color:#9a6b00}
.actions{margin-top:14px}

.proof{margin-top:12px}
.proof summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;padding:4px 0}
.proof ol{margin:6px 0 0;padding-left:26px;font-size:16px}
.proof li{padding:2px 0}
.proof li.now{color:var(--muted)}

/* ── 화면 키패드(빈칸 단계에서만). 휴대폰 키보드가 그림을 가리지 않도록 직접 만든 키패드 ── */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#e9ebf0;border-top:1px solid #d5d8df;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.keypad .grid{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{border:0;background:#fff;border-radius:10px;height:48px;font-size:22px;box-shadow:0 1px 0 #c5c8cf}
.key.fn{background:#d9dce3;font-size:22px;font-weight:600}
body.haskp .mbody{padding-bottom:150px}

/* ── 팝업 ── */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-size:22px}
.modal .big{font-size:30px;font-weight:800;text-align:center;margin:10px 0 14px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px)}
.sheet ol{margin:0;padding-left:24px;font-size:17px;line-height:34px}
.note{font-size:13px;color:var(--muted);margin:8px 0 14px}
.sumlist{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.sumlist div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sumlist .f{font-size:22px;font-weight:800}
.sumlist .s{font-size:13px;color:var(--muted);text-align:right}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;z-index:60;max-width:90vw;text-align:center}

/* ── 태블릿(개인 풀이): 학교에서 주로 태블릿을 쓰므로 화면을 넓게, 글씨·버튼을 크게 ── */
@media (min-width:700px){
  body:not(.tv){font-size:20px}
  body:not(.tv) .wrap,body:not(.tv) .topbar .in,body:not(.tv) .mbody,body:not(.tv) .keypad .grid{max-width:780px}
  body:not(.tv) .title{font-size:34px}
  body:not(.tv) .subtitle{font-size:18px}
  body:not(.tv) .defs{font-size:19px}
  body:not(.tv) .mitem .f{font-size:24px}
  body:not(.tv) .mitem .s{font-size:16px}
  body:not(.tv) .q{font-size:23px}
  body:not(.tv) .opt{font-size:22px;min-height:60px}
  body:not(.tv) .tmpl{font-size:32px}
  body:not(.tv) .btn{min-height:56px;font-size:19px}
  body:not(.tv) .fb,body:not(.tv) .hint,body:not(.tv) .cmp .box{font-size:19px}
  body:not(.tv) .proof ol{font-size:19px}
  body:not(.tv) .figbox svg{max-height:36vh}
  body:not(.tv) .chip{font-size:16px}
  body:not(.tv) .topbar .t{font-size:22px}
  body:not(.tv) .prog{font-size:17px}
  body:not(.tv) .back{font-size:26px;width:52px;height:52px}
  body:not(.tv) .stephead,body:not(.tv) .fighint,body:not(.tv) .proof summary{font-size:16px}
  body:not(.tv) .seg button{font-size:19px;padding:12px}
  body:not(.tv) .key{height:58px;font-size:26px}
  body:not(.tv).haskp .mbody{padding-bottom:170px}
  body:not(.tv) textarea{font-size:19px;min-height:120px}
  body:not(.tv) .modal{max-width:640px}
}
/* 가로 태블릿: 그림 왼쪽 고정, 문제 오른쪽 (TV 시연과 같은 배치) */
@media (min-width:1000px) and (orientation:landscape){
  body:not(.tv) .topbar .in{max-width:1300px}
  body:not(.tv) .mbody{max-width:1300px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;padding:18px 24px}
  body:not(.tv) .figbox{top:76px;margin:0}
  body:not(.tv) .figbox svg{max-height:68vh}
  body:not(.tv) .keypad{position:static;background:transparent;border:0;padding:0;margin-top:12px}
  body:not(.tv).haskp .mbody{padding-bottom:24px}
}

/* ── TV 시연 모드: 가로 큰 화면, 그림 왼쪽 / 문제 오른쪽 ── */
body.tv{font-size:22px}
body.tv .wrap{max-width:900px}
body.tv .topbar .in,body.tv .mbody{max-width:1500px}
body.tv .mbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start;padding:20px 28px}
body.tv .figbox{position:sticky;top:80px;margin:0}
body.tv .figbox svg{max-height:70vh}
body.tv .chip{font-size:18px}
body.tv .q{font-size:28px}
body.tv .opt{font-size:26px;padding:14px 18px}
body.tv .tmpl{font-size:38px}
body.tv .fb,body.tv .hint{font-size:22px}
body.tv .proof ol{font-size:22px}
body.tv .proof summary,body.tv .stephead{font-size:18px}
body.tv .topbar .t{font-size:24px}
body.tv .keypad{position:static;background:transparent;border:0;padding:0;margin-top:14px}
body.tv .keypad .key{height:60px;font-size:30px}
body.tv .keypad .key.fn{font-size:26px}
body.tv .prog{font-size:20px}
body.tv .back{font-size:30px;width:56px;height:56px}
body.tv.haskp .mbody{padding-bottom:24px}
body.tv .cmp .box{font-size:22px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   설정 영역 — 선생님이 직접 고치는 곳
   ---------------------------------------------------------------------
   · COLORS : 삼각형 색
   · MISSIONS : 미션별 단계. 각 단계의 type은 세 가지입니다.
       - 'choice' : 선택형. options(보기)와 answer(정답 보기의 번호, 0부터 셈)
       - 'blank'  : 빈칸형. template의 □ 자리에 들어갈 답을 answer에 적습니다.
                    cx와 xc, c×x처럼 같은 식은 자동으로 모두 정답 처리됩니다.
                    (입력에 쓸 수 있는 기호: a b c x y h ² × + ( ) )
       - 'essay'  : 서술형. model(모범 답안)을 보여주고 학생이 스스로 점검합니다.
   · hints : [1차 힌트(방향 제시), 2차 힌트(거의 정답)]
   · proof : 이 단계를 마치면 '증명' 칸에 한 줄로 쌓이는 문장
   · hl : 그림 힌트 — tri(색칠할 삼각형), angles(표시할 각), sides(형광펜 칠할 변)
         처음엔 기본 그림만 보이고, 한 번 틀리거나 [힌트]를 누르면 '그림 힌트'로 나타납니다.
         (힌트 순서: 그림 힌트 → hints의 1차 → 2차)
         sides에 'BC'라고 쓰면 노란 형광펜, 'BC:ABC'라고 쓰면 △ABC 색 형광펜
         각 이름은 가운데 글자가 꼭짓점입니다. 예) 'ABC' = ∠B, 'BAD' = ∠BAD
   ※ 글 속의 소문자 a, b, c, x, y, h는 자동으로 기울임꼴(수학 문자)로 바뀝니다.
   ===================================================================== */
const COLORS = {
  ABC: '#2563eb', // 파랑
  DBA: '#ea7a17', // 주황
  DAC: '#16a34a', // 초록
};

const MISSIONS = [
  { // ───────────── 미션 1 ─────────────
    formula: 'a² = cx', basis: '△ABC ∽ △DBA',
    steps: [
      { type:'choice', hl:{tri:['ABC','DBA']},
        q:'△ABC와 닮은 작은 삼각형 중 꼭짓점 B를 함께 가진 것은? (대응하는 꼭짓점 순서대로)',
        options:['△DBA','△BDA','△ABD','△DAC'], answer:0,
        hints:['△ABC의 꼭짓점 A, B, C에 각각 어느 꼭짓점이 대응하는지 생각해 보세요.',
               'A(직각) ↔ D(직각), B ↔ B, C ↔ A 순서로 써요.'],
        proof:'△ABC와 △DBA에서' },
      { type:'choice', hl:{tri:['ABC','DBA'],angles:['ABC']},
        q:'두 삼각형에서 공통인 각은?',
        options:['∠A','∠B','∠C'], answer:1,
        hints:['두 삼각형이 함께 가진 꼭짓점을 찾아보세요.',
               '꼭짓점 B의 각은 두 삼각형 모두에 들어 있어요.'],
        proof:'∠B는 공통' },
      { type:'choice', hl:{tri:['ABC','DBA'],angles:['BAC','BDA']},
        q:'크기가 같은 직각의 짝은?',
        options:['∠BAC = ∠BDA = 90°','∠BAD = ∠BDA = 90°','∠ABD = ∠BAC = 90°'], answer:0,
        hints:['그림에서 직각 표시가 있는 곳을 찾아보세요.',
               '△ABC의 직각은 ∠BAC, △DBA의 직각은 ∠BDA예요.'],
        proof:'∠BAC = ∠BDA = 90°' },
      { type:'essay', hl:{tri:['ABC','DBA'],angles:['ABC','BAC','BDA']},
        q:'△ABC와 △DBA가 닮은 이유를 닮음 조건과 함께 써 보세요.',
        model:'∠B는 공통이고, ∠BAC = ∠BDA = 90°이므로 두 쌍의 대응각의 크기가 각각 같다. 따라서 △ABC ∽ △DBA (AA 닮음)',
        proof:'∴ △ABC ∽ △DBA (AA 닮음)' },
      { type:'blank', hl:{tri:['ABC','DBA'],sides:['BC:ABC','AB:ABC','AB:DBA','BD:DBA']},
        q:'닮은 도형에서 대응변의 길이의 비는 같아요. 빈칸을 채우세요.',
        template:'c : a = a : □', answer:'x',
        hints:['△ABC의 BC(=c)에 대응하는 변은 △DBA의 BA(=a)예요. 그럼 △ABC의 AB(=a)에 대응하는 변은?',
               'AB에 대응하는 변은 DB이고, 그 길이는 x예요.'],
        proof:'BC : BA = BA : BD 이므로 c : a = a : x' },
      { type:'blank', hl:{tri:['ABC','DBA']},
        q:'비례식을 정리하세요. (외항의 곱 = 내항의 곱)',
        template:'a² = □', answer:'cx',
        hints:['c : a = a : x 에서 바깥쪽 두 항(외항)을 곱해 보세요.',
               '외항의 곱은 c × x 예요.'],
        proof:'∴ a² = cx' },
    ]
  },
  { // ───────────── 미션 2 ─────────────
    formula: 'b² = cy', basis: '△ABC ∽ △DAC',
    steps: [
      { type:'choice', hl:{tri:['ABC','DAC']},
        q:'△ABC와 닮은 작은 삼각형 중 꼭짓점 C를 함께 가진 것은? (대응하는 꼭짓점 순서대로)',
        options:['△DAC','△ADC','△CDA','△DBA'], answer:0,
        hints:['△ABC의 꼭짓점 A, B, C에 각각 어느 꼭짓점이 대응하는지 생각해 보세요.',
               'A(직각) ↔ D(직각), B ↔ A, C ↔ C 순서로 써요.'],
        proof:'△ABC와 △DAC에서' },
      { type:'choice', hl:{tri:['ABC','DAC'],angles:['ACB']},
        q:'두 삼각형에서 공통인 각은?',
        options:['∠A','∠B','∠C'], answer:2,
        hints:['두 삼각형이 함께 가진 꼭짓점을 찾아보세요.',

/* ---------- 글자 표시 ----------
   소문자 a,b,c,x,y,h → 기울임 수학 문자, ² → 위 첨자.
   한 글자씩 처리하는 이유: HTML 특수문자(&amp; 등)의 영문자를 잘못 바꾸지 않기 위해 */
function fmt(t) {
  let o = '';
  // ' : '가 줄 끝에서 끊기지 않게 붙는 공백으로
  const s = [...String(t).replace(/ : /g, '\u00a0:\u00a0')];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    // 두 글자 선분 이름(AB, BD …)에는 선분 기호(윗줄)를 붙인다.
    // △ABC·∠BAC처럼 더 긴 이름이나 'AA 닮음'의 AA는 건드리지 않는다.
    const pair = ch + (s[i + 1] || '');
    if (/^[A-D]{2}$/.test(pair) && pair !== 'AA' && !/[A-Z]/.test(s[i + 2] || '') && !/[A-Z△∠]/.test(s[i - 1] || '')) {
      o += `<span class="ol">${pair}</span>`; i++; continue;
    }
    if ('abcxyh'.includes(ch)) o += `<i class="v">${ch}</i>`;
    else if (ch === '²') o += '<sup>2</sup>';
    else if (ch === '<') o += '&lt;';
    else if (ch === '>') o += '&gt;';
    else if (ch === '&') o += '&amp;';
    else if (ch === '"') o += '&quot;';
    else o += ch;
  }
  return o;
}
function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- 채점: 식을 다항식으로 바꿔 비교 ----------
   cx, xc, c×x, c(x) 가 모두 같은 식으로 인정되도록
   문자 순서와 곱셈 기호를 무시하고 '같은 다항식인가'로 판정한다. */
function parsePoly(src) {
  const s = src.replace(/\s+/g, '').replace(/[·*]/g, '×').replace(/\^2/g, '²');
  let i = 0;
  const peek = () => s[i];
  const num = n => ({ '': n });
  const add = (p, q) => { const r = { ...p }; for (const k in q) r[k] = (r[k] || 0) + q[k]; return r; };
  const mul = (p, q) => {
    const r = {};
    for (const a in p) for (const b in q) {
      const k = (a + b).split('').sort().join('');
      r[k] = (r[k] || 0) + p[a] * q[b];
    }
    return r;
  };
  function expr() { let p = term(); while (peek() === '+') { i++; p = add(p, term()); } return p; }
  function term() {
    let p = factor();
    while (i < s.length) {
      if (peek() === '×') { i++; p = mul(p, factor()); }
      else if (/[abcxyh0-9(]/.test(peek())) p = mul(p, factor()); // 곱셈 기호 생략(cx)
      else break;
    }
    return p;
  }
  function factor() { let p = atom(); while (peek() === '²') { i++; p = mul(p, p); } return p; }
  function atom() {
    const ch = peek();
    if (ch === '(') { i++; const p = expr(); if (peek() !== ')') throw 0; i++; return p; }
    if (ch && 'abcxyh'.includes(ch)) { i++; return { [ch]: 1 }; }
    if (ch && /[0-9]/.test(ch)) { let n = ''; while (/[0-9]/.test(peek() || '')) n += s[i++]; return num(+n); }
    throw 0;
  }
  if (!s) throw 0;
  const p = expr();
  if (i !== s.length) throw 0;
  return p;
}
function samePoly(p, q) {
  const clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== 0));
  const a = clean(p), b = clean(q);
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => a[k] === b[k]);
}
/* 반환: true(정답) / false(오답) / null(식을 읽을 수 없음) */
function gradeBlank(input, answer) {
  let p;
  try { p = parsePoly(input); } catch (e) { return null; }
  return samePoly(p, parsePoly(answer));
}

/* ---------- 그림 ----------
   변 비율 3:4:5 (a=3, b=4, c=5 → x=1.8, y=3.2, h=2.4)로 확실히 기울어진 삼각형.
   이등변처럼 보이면 x=y로 착각하기 쉬워서 일부러 비대칭으로 그렸다. */
const P = { A: [184, 58], B: [40, 250], C: [440, 250], D: [184, 250] };
const RIGHT = ['BAC', 'BDA', 'ADC'];

function unit(from, to) {
  const dx = to[0] - from[0], dy = to[1] - from[1], L = Math.hypot(dx, dy);
  return [dx / L, dy / L];
}
function angleMark(name, color, opacity) {
  const V = P[name[1]], u1 = unit(V, P[name[0]]), u2 = unit(V, P[name[2]]);
  if (RIGHT.includes(name)) {
    const r = 16, p1 = [V[0] + u1[0]*r, V[1] + u1[1]*r], p3 = [V[0] + u2[0]*r, V[1] + u2[1]*r];
    const p2 = [p1[0] + u2[0]*r, p1[1] + u2[1]*r];
    return `<path d="M${V} L${p1} L${p2} L${p3} Z" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="1.6"/>`;
  }
  const r = 30, p1 = [V[0] + u1[0]*r, V[1] + u1[1]*r], p2 = [V[0] + u2[0]*r, V[1] + u2[1]*r];
  const sweep = (u1[0]*u2[1] - u1[1]*u2[0]) > 0 ? 1 : 0;
  return `<path d="M${V} L${p1} A${r} ${r} 0 0 ${sweep} ${p2} Z" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="1.6"/>`;
}
function drawFigure(hl = {}) {
  const tri = hl.tri || [], sides = hl.sides || [], angles = hl.angles || [];
  let s = `<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="직각삼각형 ABC 그림">`;
  // 1) 삼각형 색칠 (큰 삼각형을 먼저, 작은 삼각형을 위에)
  for (const t of ['ABC', 'DBA', 'DAC']) if (tri.includes(t)) {
    s += `<polygon points="${t.split('').map(k => P[k].join(',')).join(' ')}" fill="${COLORS[t]}" fill-opacity="${t === 'ABC' ? .13 : .26}"/>`;
  }
  // 2) 형광펜으로 변 강조
  //    'BC'      → 노란 형광펜
  //    'BC:ABC'  → 그 삼각형 색 형광펜. 먼저 나온 삼각형은 굵게, 다음 삼각형은 가늘게 위에 칠해서
  //               BC와 BD처럼 겹치는 변(또는 두 삼각형이 함께 쓰는 변)도 구별되게 한다.
  const triOrder = [];
  for (const sd of sides) { const t = sd.split(':')[1]; if (t && !triOrder.includes(t)) triOrder.push(t); }
  const sorted = [...sides].sort((u, v) => triOrder.indexOf(u.split(':')[1]) - triOrder.indexOf(v.split(':')[1]));
  for (const sd of sorted) {
    const [seg, t] = sd.split(':'), p = P[seg[0]], q = P[seg[1]];
    const color = t ? COLORS[t] : 'var(--marker)';
    const first = t && triOrder.indexOf(t) === 0;
    const w = t ? (first ? 18 : 9) : 13;
    const op = t ? (first ? .4 : .9) : .75;
    s += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  }
  // 3) 기본 직각 표시(회색) — 강조되지 않은 경우만
  for (const r of ['BAC', 'ADC']) if (!angles.includes(r)) s += angleMark(r, '#6b7280', 0);
  // 4) 강조한 각
  for (const a of angles) s += angleMark(a, 'var(--angle)', .28);
  // 5) 선분
  const seg = (a, b) => `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>`;
  s += seg('A','B') + seg('A','C') + seg('B','C') + seg('A','D');
  for (const k of 'ABCD') s += `<circle cx="${P[k][0]}" cy="${P[k][1]}" r="3" fill="#1f2328"/>`;
  // 6) 꼭짓점 이름
  const T = (x, y, t, extra = '') => `<text x="${x}" y="${y}" ${extra}>${t}</text>`;
  s += `<g font-family="Times New Roman,serif" font-size="22" fill="#1f2328" text-anchor="middle">`;
  s += T(184, 46, 'A') + T(24, 258, 'B') + T(458, 258, 'C') + T(184, 276, 'D');
  s += `</g>`;
  // 7) 길이 문자 (기울임)
  s += `<g font-family="Times New Roman,serif" font-style="italic" font-size="24" fill="#1d3fa8" text-anchor="middle">`;
  s += T(98, 146, 'a') + T(328, 146, 'b') + T(198, 176, 'h') + T(112, 276, 'x') + T(312, 276, 'y');
  // c는 BC 전체를 묶는 괄호 아래에
  s += `</g><path d="M40 288 v8 h400 v-8" fill="none" stroke="#1d3fa8" stroke-width="1.4"/>`;
  s += T(240, 316, 'c', 'font-family="Times New Roman,serif" font-style="italic" font-size="24" fill="#1d3fa8" text-anchor="middle"');
  s += `</svg>`;
  const legend = ['ABC', 'DBA', 'DAC'].filter(t => tri.includes(t))
    .map(t => `<span class="chip" style="background:${COLORS[t]}">△${t}</span>`).join('');
  return s + `<div class="legend">${legend}</div>`;
}

/* ---------- 화면: 시작 ---------- */
function isLocked(i) {
  const need = MISSIONS[i].needs || [];
  return need.some(n => !state.done.has(n));
}
function renderStart() {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  document.body.classList.remove('haskp');
  const items = MISSIONS.map((m, i) => {
    const done = state.done.has(i), locked = isLocked(i);
    const st = done ? '✓ 완료' : locked ? '🔒 미션 1·2 후' : '';
    return `<button class="mitem ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-m="${i}">
      <span class="mnum">${i + 1}</span>
      <span><div class="f">${fmt(m.formula)}</div><div class="s">${fmt(m.basis)}</div></span>
      <span class="st">${st}</span></button>`;
  }).join('');
  const allDone = state.done.size === MISSIONS.length;
  app.innerHTML = `<div class="wrap">
    <h1 class="title">직각삼각형 5공식</h1>
    <p class="subtitle">${fmt('∠A = 90°인 직각삼각형 ABC에서 꼭짓점 A에서 빗변 BC에 내린 수선의 발을 D라고 할 때')}</p>
    <div class="card">
      <div class="figbox" style="position:static;border:0;padding:0;margin:0">${drawFigure({})}</div>
      <div class="defs">
        <span>${fmt('AB = a')}</span><span>${fmt('AC = b')}</span><span>${fmt('BC = c')}</span>
        <span>${fmt('BD = x')}</span><span>${fmt('CD = y')}</span><span>${fmt('AD = h')}</span>
      </div>
    </div>
    <div class="seg" role="tablist">
      <button data-mode="solo" class="${state.mode === 'solo' ? 'on' : ''}">개인 풀이</button>
      <button data-mode="tv" class="${state.mode === 'tv' ? 'on' : ''}">TV 시연</button>
    </div>
    <div class="mlist">${items}</div>
    ${allDone ? `<div class="actions"><button class="btn primary" style="width:100%" id="sumBtn">다섯 공식 모아보기</button></div>` : ''}
  </div>`;
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const i = +b.dataset.m;
    if (isLocked(i)) return toast('미션 1과 미션 2를 먼저 완료하세요');
    startMission(i);
  });
  const sb = document.getElementById('sumBtn'); if (sb) sb.onclick = showSummary;
  window.scrollTo(0, 0);
}
function setMode(mode) {
  state.mode = mode;
  document.body.classList.toggle('tv', mode === 'tv');
  renderStart();
}

/* ---------- 화면: 미션 ---------- */
function startMission(i) {
  state.m = i; state.s = 0; state.proof = [];
  resetStep();
  renderMission();
  window.scrollTo(0, 0);
}
function resetStep() {
  state.phase = 'answer'; state.input = ''; state.essay = '';
  state.wrong = 0; state.hint = 0; state.picked = null; state.feedback = null; state.figHint = false;
}
const curMission = () => MISSIONS[state.m];
const curStep = () => curMission().steps[state.s];
const isTV = () => state.mode === 'tv';

function renderMission() {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const M = curMission(), st = curStep(), n = M.steps.length;
  const showKeypad = st.type === 'blank' && state.phase === 'answer';
  document.body.classList.toggle('haskp', showKeypad);

  app.innerHTML = `
  <div class="topbar"><div class="in">
    <button class="back" id="backBtn" aria-label="목록으로">←</button>
    <div class="t">미션 ${state.m + 1} &nbsp;${fmt(M.formula)}</div>
    <div class="prog">${state.s + 1}/${n}</div>
  </div><div class="pbar"><div style="width:${(state.s / n) * 100}%"></div></div></div>
  <div class="mbody">
    <div class="figbox">${drawFigure(figHintShown(st) ? st.hl : {})}${figHintShown(st) && state.phase === 'answer' ? '<div class="fighint">💡 그림 힌트</div>' : ''}</div>
    <div class="panel">
      <div class="card" id="stepCard">${renderStepBody(st)}</div>
      ${showKeypad ? renderKeypad() : ''}
      ${renderProof()}
    </div>
  </div>`;
  bindStep(st);
  document.getElementById('backBtn').onclick = askLeave;
}

/* 그림 강조(색칠한 삼각형·각·변)는 답을 알려주는 셈이라, 처음엔 기본 그림만 보여준다.
   한 번 틀리거나 [힌트]를 누르면 '그림 힌트'로 강조가 나타나고, 정답을 맞힌 뒤에도 확인용으로 보인다. */
function hasFigHint(st) { const h = st.hl || {}; return ['tri','angles','sides'].some(k => (h[k] || []).length); }
function figHintShown(st) { return hasFigHint(st) && (state.figHint || state.wrong > 0 || state.phase !== 'answer'); }

function renderStepBody(st) {
  let h = `<div class="stephead">${state.s + 1}단계 · ${{choice:'고르기', blank:'빈칸 채우기', essay:'서술하기'}[st.type]}</div>`;
  h += `<p class="q">${fmt(st.q)}</p>`;

  if (st.type === 'choice') {
    h += `<div class="opts">` + st.options.map((o, i) => {
      let cls = '';
      if ((state.phase === 'correct' || state.phase === 'revealed') && i === st.answer) cls = 'right';
      else if (state.phase === 'answer' && state.picked === i) cls = 'wrong';
      return `<button class="opt ${cls}" data-opt="${i}">${fmt(o)}</button>`;
    }).join('') + `</div>`;
  }

  if (st.type === 'blank') {
    let inner, cls = 'blank';
    if (state.phase === 'answer') {
      inner = fmt(state.input) + '<span class="caret"></span>';
      if (state.input) cls += ' filled';
      if (state.feedback && state.feedback.kind === 'bad') cls += ' wrong';
    } else {
      inner = fmt(state.phase === 'revealed' ? st.answer : state.input);
      cls += ' filled right';
    }
    const [before, after] = st.template.split('□');
    h += `<div class="tmpl">${fmt(before)}<span class="${cls}">${inner}</span>${fmt(after || '')}</div>`;
  }

  if (st.type === 'essay') {
    // 개인 풀이: 쓰기 → 내 답과 모범 답안 나란히 / TV 시연: 말로 답한 뒤 모범 답안만 공개
    if (state.phase === 'answer') {
      if (!isTV()) h += `<textarea id="essay" placeholder="여기에 이유를 써 보세요">${esc(state.essay)}</textarea>`;
    } else {
      h += `<div class="cmp">
        ${isTV() ? '' : `<div class="box mine"><div class="lab">내 답</div>${esc(state.essay)}</div>`}
        <div class="box model"><div class="lab">모범 답안</div>${fmt(st.model)}</div></div>`;
    }
  }

  if (state.feedback) h += `<div class="fb ${state.feedback.kind}">${fmt(state.feedback.text)}</div>`;

  // 힌트 순서: 그림 힌트 → 글 힌트 1 → 글 힌트 2
  const hintItems = [];
  if (state.phase === 'answer' && figHintShown(st)) hintItems.push('<b>그림 힌트</b> · 위 그림에 강조 표시를 했어요.');
  if (st.hints) st.hints.slice(0, state.hint).forEach((t, i) => hintItems.push(`<b>힌트 ${i + 1}</b> · ${fmt(t)}`));
  if (hintItems.length) h += `<div class="hints">` + hintItems.map(x => `<div class="hint">${x}</div>`).join('') + `</div>`;

  h += `<div class="actions row">${renderButtons(st)}</div>`;
  return h;
}

function renderButtons(st) {
  const last = state.s === curMission().steps.length - 1;
  const nextLabel = last ? '미션 완료 ✓' : '다음 단계 →';
  if (state.phase === 'correct' || state.phase === 'revealed') {
    return `<button class="btn primary" data-act="next">${nextLabel}</button>`;
  }
  if (st.type === 'essay') {
    if (isTV()) return `<button class="btn primary" data-act="model">모범 답안 보기</button>`;
    if (state.phase === 'compare') {
      return `<button class="btn ghost" data-act="retry">다시 볼게요</button>
              <button class="btn ok" data-act="selfok">맞게 썼어요 →</button>`;
    }
    return `<button class="btn primary" data-act="compare">모범 답안과 비교하기</button>`;
  }
  // 선택형·빈칸형
  let b = '';
  const figPending = hasFigHint(st) && !figHintShown(st);
  const hasMoreHint = figPending || (st.hints && state.hint < st.hints.length);
  const anyShown = figHintShown(st) || state.hint > 0;
  if (hasMoreHint) b += `<button class="btn ghost" data-act="hint">힌트${anyShown ? ' 더 보기' : ''}</button>`;
  if (st.type === 'blank') b += `<button class="btn primary" data-act="check">확인</button>`;
  if (isTV()) b += `<button class="btn" data-act="reveal">정답 공개</button>`;
  else if (state.wrong >= WRONG_LIMIT) b += `<button class="btn" data-act="reveal">정답 보고 넘어가기</button>`;
  return b;
}

function renderKeypad() {
  const keys = ['a','b','c','x','y','h','²','×','+','(',')','⌫'];
  return `<div class="keypad"><div class="grid">` + keys.map(k => {
    const fn = '²×+()⌫'.includes(k);
    const label = 'abcxyh'.includes(k) ? fmt(k) : k;
    return `<button class="key ${fn ? 'fn' : ''}" data-key="${k}">${label}</button>`;
  }).join('') + `</div></div>`;
}

function renderProof() {
  if (!state.proof.length) return '';
  const lines = state.proof.map(t => `<li>${fmt(t)}</li>`).join('') + `<li class="now">…</li>`;
  return `<details class="proof card" open><summary>지금까지의 증명 (${state.proof.length}줄)</summary><ol>${lines}</ol></details>`;
}

/* ---------- 버튼 연결 ---------- */
function bindStep(st) {
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => pickOption(+b.dataset.opt));
  app.querySelectorAll('[data-key]').forEach(b => b.onclick = () => pressKey(b.dataset.key));
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ACT[b.dataset.act]());
  const ta = document.getElementById('essay');
  if (ta) ta.oninput = () => { state.essay = ta.value; };
}

const ACT = {
  hint() { // 그림 힌트를 아직 안 봤으면 그림부터, 그다음 글 힌트
    const st = curStep();
    if (hasFigHint(st) && !figHintShown(st)) state.figHint = true; else state.hint++;
    renderMission();
  },
  check() { checkBlank(); },
  reveal() {
    state.phase = 'revealed';
    state.feedback = { kind: 'info', text: '정답을 확인하고 다음 단계로 넘어가요.' };
    state.proof.push(curStep().proof);
    renderMission();
  },
  next() { goNext(); },
  compare() {
    if (!state.essay.trim()) return toast('답을 입력해 주세요');
    state.phase = 'compare';
    state.feedback = { kind: 'info', text: '모범 답안과 비교해 보세요. 핵심 근거가 모두 들어 있나요?' };
    renderMission();
  },
  retry() { state.phase = 'answer'; state.feedback = null; renderMission(); focusEssay(); },
  selfok() {
    state.phase = 'correct';
    state.feedback = { kind: 'ok', text: '좋아요! 이 내용이 증명에 들어가요.' };
    state.proof.push(curStep().proof);
    renderMission();
  },
  model() { // TV 모드 서술형: 모범 답안 바로 공개
    state.phase = 'correct'; state.feedback = null;
    state.proof.push(curStep().proof);
    renderMission();
  },
};
function focusEssay() { const t = document.getElementById('essay'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }

function pickOption(i) {
  if (state.phase !== 'answer') return;
  const st = curStep();
  state.picked = i;
  if (i === st.answer) {
    state.phase = 'correct';
    state.feedback = { kind: 'ok', text: '정답!' };
    state.proof.push(st.proof);
  } else {
    state.wrong++;
    state.feedback = { kind: 'bad', text: wrongText() };
  }
  renderMission();
}
function wrongText() {
  if (isTV()) return '다시 생각해 봐요.';
  if (state.wrong >= WRONG_LIMIT) return '아직 아니에요. 힌트를 보거나 정답을 보고 넘어갈 수 있어요.';
  return hasFigHint(curStep()) ? '다시 생각해 봐요. 그림에 힌트를 표시했어요. 더 필요하면 [힌트 더 보기]를 눌러 보세요.'
                               : '다시 생각해 봐요. 막히면 [힌트]를 눌러 보세요.';
}
function pressKey(k) {
  if (state.phase !== 'answer') return;
  if (k === '⌫') state.input = [...state.input].slice(0, -1).join('');
  else if (state.input.length < 16) state.input += k;
  if (state.feedback && state.feedback.kind === 'bad') state.feedback = null;
  // 키패드는 다시 그리지 않고 빈칸만 바꿔 깜박임을 줄인다
  document.getElementById('stepCard').innerHTML = renderStepBody(curStep());
  bindStep(curStep());
}
function checkBlank() {
  if (state.phase !== 'answer') return;
  const st = curStep();
  if (!state.input.trim()) return toast('답을 입력해 주세요');
  const r = gradeBlank(state.input, st.answer);
  if (r === null) {
    state.feedback = { kind: 'bad', text: '식을 읽을 수 없어요. 괄호나 기호를 확인해 주세요.' };
  } else if (r) {
    state.phase = 'correct';
    state.feedback = { kind: 'ok', text: '정답!' };
    state.proof.push(st.proof);
  } else {
    state.wrong++;
    state.feedback = { kind: 'bad', text: wrongText() };
  }
  renderMission();
}
function goNext() {
  const M = curMission();
  if (state.s < M.steps.length - 1) {
    state.s++; resetStep(); renderMission();
    // 휴대폰에서 새 단계 카드가 보이도록
    if (!isTV()) document.getElementById('stepCard').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    state.done.add(state.m);
    showComplete();
  }
}

/* 물리 키보드(교실 PC·TV 시연용) — 빈칸 단계에서만 */
document.addEventListener('keydown', e => {
  if (state.m === null || document.querySelector('.overlay')) return;
  const st = curStep && state.m !== null ? curStep() : null;
  if (!st || st.type !== 'blank' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Enter') { e.preventDefault(); return state.phase === 'answer' ? checkBlank() : goNext(); }
  if (state.phase !== 'answer') return;
  const map = { Backspace: '⌫', '^': '²', '2': '²', '*': '×', '+': '+', '(': '(', ')': ')' };
  let k = map[e.key] || (('abcxyh').includes(e.key.toLowerCase()) && e.key.length === 1 ? e.key.toLowerCase() : null);
  if (k) { e.preventDefault(); pressKey(k); }
});

/* ---------- 팝업 ---------- */
function modal(html, bind) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(ov);
  bind(ov, () => ov.remove());
}
function askLeave() {
  const started = state.s > 0 || state.phase !== 'answer' || state.input || state.essay;
  if (!started) return goHome();
  modal(`<h2>목록으로 나갈까요?</h2><p>진행 중인 풀이가 사라져요. 다시 들어오면 처음부터 시작해요.</p>
    <div class="row"><button class="btn" data-x>계속 풀기</button><button class="btn primary" data-go>나가기</button></div>`,
    (ov, close) => { ov.querySelector('[data-x]').onclick = close; ov.querySelector('[data-go]').onclick = () => { close(); goHome(); }; });
}
function goHome() { state.m = null; renderStart(); }

function showComplete() {
  const i = state.m, M = MISSIONS[i];
  // 다음에 풀 수 있는 미완료 미션
  const next = MISSIONS.findIndex((_, k) => k !== i && !state.done.has(k) && !isLocked(k));
  const allDone = state.done.size === MISSIONS.length;
  const lines = state.proof.map(t => `<li>${fmt(t)}</li>`).join('');
  modal(`<h2>미션 ${i + 1} 완료!</h2>
    <div class="big">${fmt(M.formula)}</div>
    <div class="sheet"><ol>${lines}</ol></div>
    <p class="note">완성된 증명을 공책에 옮겨 적어 보세요.</p>
    <div class="row">
      <button class="btn" data-home>목록으로</button>
      ${allDone ? `<button class="btn primary" data-sum>다섯 공식 모아보기</button>`
        : next >= 0 ? `<button class="btn primary" data-next>미션 ${next + 1} 시작 →</button>` : ''}
    </div>`, (ov, close) => {
      ov.querySelector('[data-home]').onclick = () => { close(); goHome(); };
      const n = ov.querySelector('[data-next]'); if (n) n.onclick = () => { close(); startMission(next); };
      const s = ov.querySelector('[data-sum]'); if (s) s.onclick = () => { close(); goHome(); showSummary(); };
    });
}
function showSummary() {
  const rows = MISSIONS.map((m, i) => `<div><span class="f">${fmt(m.formula)}</span><span class="s">미션 ${i + 1}<br>${fmt(m.basis)}</span></div>`).join('');
  modal(`<h2>직각삼각형 5공식</h2>
    <p class="note" style="margin:2px 0 0">${fmt('∠A = 90°, AD ⊥ BC일 때')}<br>${fmt('AB = a, AC = b, BC = c, BD = x, CD = y, AD = h')}</p>
    <div class="sumlist">${rows}</div>
    <div class="row"><button class="btn primary" data-x>닫기</button></div>`,
    (ov, close) => { ov.querySelector('[data-x]').onclick = close; });
}

let toastTimer;
function toast(t) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 1800);
}

renderStart();
</script>
</body>
</html>
