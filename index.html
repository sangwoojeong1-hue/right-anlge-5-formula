<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>직각삼각형 5공식</title>
<!-- 귀여운 글꼴(구글 폰트): 주아(제목·버튼), 개구(말풍선·본문). 인터넷이 없으면 기기 기본 글꼴로 보입니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────
   화면 색 — 바꾸고 싶으면 이 :root 값만 고치면 됩니다.
   (도형 색은 아래 <script> 설정 영역의 COLORS에서)
   ─────────────────────────────────────────────── */
:root{
  --chat-bg:#b9d0e5;   /* 대화창 배경(하늘빛) */
  --head:#a6c1da;      /* 대화창 위쪽 막대 */
  --list-bg:#eef4fa;   /* 시작 화면 배경 */
  --me:#ffe45c;        /* 학생 말풍선(노랑) */
  --bot:#ffffff;       /* 직각이 말풍선 */
  --ink:#1d2430;
  --muted:#5f6b7a;
  --line:#d9e2ec;
  --accent:#2d6cdf;
  --ok:#14804a;
  --bad:#c2410c;
  --marker:#ffd84d;    /* 형광펜 */
  --angle:#e11d48;     /* 각 표시 */
  --dock:#f7f9fb;      /* 아래 입력 영역 */
  /* 글꼴 — 바꾸려면 위 <link>의 글꼴 이름과 이 두 줄을 함께 고칩니다 */
  --font-body:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;  /* 말풍선·본문 */
  --font-head:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;    /* 제목·버튼 */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--list-bg);color:var(--ink);
  font-family:var(--font-body);font-weight:700;
  font-size:19px;line-height:1.5; /* 개구는 글자가 작아 보여서 조금 크게 */-webkit-text-size-adjust:100%;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.ol{text-decoration:overline;text-decoration-thickness:1.5px} /* 선분 기호 AB̅ */
/* 문자(a, b, c, x, y, h)는 교과서처럼 기울임 세리프 */
i.v{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.12em;font-weight:400;padding:0 .04em}
sup{font-family:"Times New Roman",Times,serif;font-weight:400;font-size:.72em;line-height:0}
.legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:2px 0}
.chip{font-family:var(--font-head);font-size:13px;padding:1px 9px;border-radius:999px;color:#fff}
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;padding:4px 12px 8px;font-size:18px}
.hidden{display:none!important}

/* ── 시작 화면(채팅 목록 느낌) ── */
.home{max-width:560px;margin:0 auto;padding-bottom:30px}
.homehead{background:var(--head);padding:18px 16px 14px;display:flex;align-items:center;gap:12px}
.homehead h1{margin:0;font-size:22px;letter-spacing:-.02em}
.homehead p{margin:0;font-size:13px;color:#33475b}
.figcard{background:#fff;margin:14px 16px 0;border-radius:16px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.figcard svg{display:block;width:100%;height:auto;max-height:260px}
.modes{display:flex;background:#dbe6f1;border-radius:12px;padding:4px;margin:12px 16px}
.modes button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rooms{background:#fff;margin:0 16px;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:#fff;padding:14px;border-bottom:1px solid #eef2f6}
.room:last-child{border-bottom:0}
.room .av{flex:none}
.room .tt{font-weight:800;font-size:16px}
.room .pv{margin-top:3px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .mid{flex:1;min-width:0}
.room .st{flex:none;font-size:13px;font-weight:800}
.room.done .st{color:var(--ok)}
.room.locked{opacity:.5}
.badge{display:inline-block;background:#ff5a4f;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.sumbtn{display:block;margin:14px 16px 0;width:calc(100% - 32px);border:0;background:var(--accent);color:#fff;font-weight:800;border-radius:14px;padding:14px}

/* ── 직각이 프로필 ── */
.av{width:40px;height:40px;border-radius:15px;background:#14b8a6;display:grid;place-items:center;overflow:hidden}
.av svg{width:100%;height:100%}

/* ── 대화 화면 ── */
.chat{position:fixed;left:0;right:0;top:0;height:var(--app-h,100dvh);display:flex;flex-direction:column;background:var(--chat-bg)}
.chathead{flex:none;background:var(--head);display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top))}
.chathead .back{border:0;background:transparent;font-size:24px;width:44px;height:44px;border-radius:10px}
.chathead .t{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .p{font-size:13px;color:#33475b;font-weight:700;margin-right:4px}
.chathead .figbtn{border:0;background:#ffffffaa;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.chatbody{flex:1;min-height:0;display:flex}
.tvfig{display:none}
.chatcol{flex:1;min-width:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%}
.log{flex:1;min-height:0;overflow-y:auto;padding:12px 10px 16px;-webkit-overflow-scrolling:touch}

.msg{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg .avs{width:40px;flex:none}
.msg .col{max-width:78%;min-width:0}
.msg .name{font-size:13px;color:#33475b;margin:0 0 3px 2px}
.bub{background:var(--bot);border-radius:4px 16px 16px 16px;padding:9px 12px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg.me .bub{background:var(--me);border-radius:16px 4px 16px 16px;white-space:pre-wrap}
.msg.cont .bub{border-radius:16px}
.bub.fig{padding:6px;width:270px;max-width:100%}
.bub.fig svg{display:block;width:100%;height:auto}
.bub.wide{width:min(320px,100%)}
.bub .k{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:4px}
.bub.model{background:#eef5ff;border:1px solid #cfe0fb}
.bub.hint{background:#fff8dc;border:1px solid #f1dc8f}
.bub.ok{background:#e9f7ee}
.card ol{margin:0;padding-left:22px}
.card li{padding:5px 0;border-bottom:1px dashed #e3e8ef}
.card li:last-child{border-bottom:0}
.card .ct{font-weight:800;margin-bottom:4px}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ok)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa7b6;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ── 아래 입력 영역 ── */
.dock{flex:none;background:var(--dock);border-top:1px solid #d6dee8;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.dock.busy{opacity:.5;pointer-events:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid #c9d6e4;background:#fff;border-radius:999px;padding:10px 16px;font-size:17px;font-weight:600;min-height:46px}
.opt.wrong{opacity:.4;text-decoration:line-through}
.btns{display:flex;gap:8px;margin-top:8px}
.btns:first-child{margin-top:0}
.btn{flex:1;border:1px solid #c9d6e4;background:#fff;border-radius:12px;padding:11px 12px;font-weight:700;min-height:46px;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{flex:none}
.btn:disabled{opacity:.4}
.preview{text-align:center;font-size:22px;padding:4px 0 8px}
.box{display:inline-block;min-width:58px;border:2px dashed var(--accent);border-radius:10px;padding:0 8px;background:#f2f6ff;vertical-align:middle;line-height:1.5}
.box.on{border-style:solid}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-.12em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.key{border:0;background:#fff;border-radius:10px;height:46px;font-size:21px;font-weight:600;box-shadow:0 1px 0 #c3cbd6;font-family:"Times New Roman",serif}
.key.lt{font-style:italic;font-size:24px}
.key.fn{background:#dfe4ec;font-family:var(--font-head)}
textarea{width:100%;border:1.5px solid #c9d6e4;border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;resize:none;background:#fff;max-height:30vh;min-height:48px;display:block}

/* ── 팝업 ── */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,24,32,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 8px;font-size:20px}
.modal svg{display:block;width:100%;height:auto}
.sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.sum .f{font-weight:800;font-size:18px}
.sum .s{font-size:13px;color:var(--muted)}

/* ── 태블릿(개인 풀이): 학교에서 주로 태블릿을 쓰므로 화면을 넓게, 글씨·버튼을 크게 ── */
@media (min-width:700px){
  body:not(.tv){font-size:23px}
  body:not(.tv) .home{max-width:780px}
  body:not(.tv) .homehead h1{font-size:30px}
  body:not(.tv) .figcard svg{max-height:340px}
  body:not(.tv) .room .tt{font-size:21px}
  body:not(.tv) .room .pv{font-size:19px}
  body:not(.tv) .chatcol{max-width:820px}
  body:not(.tv) .msg .col{max-width:74%}
  body:not(.tv) .av,body:not(.tv) .msg .avs{width:48px;height:48px}
  body:not(.tv) .msg .avs{height:auto}
  body:not(.tv) .bub.fig{width:420px}
  body:not(.tv) .bub.wide{width:min(460px,100%)}
  body:not(.tv) .bub .k,body:not(.tv) .msg .name{font-size:16px}
  body:not(.tv) .opt{font-size:23px;padding:12px 22px;min-height:56px}
  body:not(.tv) .btn{font-size:20px;min-height:56px}
  body:not(.tv) .preview{font-size:32px}
  body:not(.tv) .key{height:58px;font-size:27px}
  body:not(.tv) textarea{font-size:21px}
  body:not(.tv) .chathead .t{font-size:22px}
  body:not(.tv) .chathead .figbtn{font-size:17px;padding:10px 14px}
}
/* 가로 태블릿: 그림을 왼쪽에 고정(그림 말풍선 대신), 대화는 오른쪽 — TV 시연과 같은 배치 */
@media (min-width:1000px) and (orientation:landscape){
  body:not(.tv) .tvfig{display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0;padding:16px}
  body:not(.tv) .tvfig .in{background:#fff;border-radius:20px;padding:12px}
  body:not(.tv) .tvfig svg{display:block;width:100%;height:auto;max-height:76vh}
  body:not(.tv) .chatcol{flex:1;max-width:none;margin:0;border-left:1px solid #a9bfd4}
  body:not(.tv) .chathead .figbtn{display:none}
}

/* ── TV 시연: 그림 왼쪽 크게, 대화 오른쪽 ── */
body.tv{font-size:22px}
body.tv .home{max-width:900px}
body.tv .chathead .t{font-size:26px}
body.tv .chathead .p{font-size:20px}
body.tv .chathead .figbtn{display:none}
body.tv .tvfig{display:flex;flex-direction:column;justify-content:center;flex:1.1;min-width:0;padding:16px}
body.tv .tvfig .in{background:#fff;border-radius:20px;padding:14px}
body.tv .tvfig svg{display:block;width:100%;height:auto;max-height:78vh}
body.tv .chatcol{flex:1;max-width:none;margin:0;border-left:1px solid #a9bfd4}
body.tv .msg .col{max-width:88%}
body.tv .opt{font-size:26px;padding:12px 22px}
body.tv .btn{font-size:22px;min-height:58px}
body.tv .preview{font-size:34px}
body.tv .key{height:58px;font-size:28px}
body.tv .name{font-size:18px}
body.tv .bub{font-size:25px}
body.tv .bub .k{font-size:17px}
body.tv .av{width:52px;height:52px}
body.tv .msg .avs{width:52px}
/* ── 글꼴: 제목·버튼·이름표는 주아(굵기 하나뿐이라 400으로), 본문·말풍선은 개구 ── */
.homehead h1,.room .tt,.room .st,.chathead,.chathead *,.modes button,.sumbtn,.badge,.btn,.opt,.name,
.bub .k,.card .ct,.modal h2,.sum .f,.preview{font-family:var(--font-head);font-weight:400}
textarea{font-family:var(--font-body);font-weight:700;font-size:18px}
.homehead p,.room .pv,.sum .s{font-size:16px}
.bub .k,.msg .name{font-size:14px}
body.tv .bub{font-size:30px} /* 개구는 작아 보여서 TV에서 더 크게 */
svg text{font-weight:400} /* 그림 속 A, B, C는 교과서처럼 보통 굵기 */
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   설정 영역 — 선생님이 직접 고치는 곳
   ---------------------------------------------------------------------
   · BOT_NAME : 대화 상대 이름
   · TYPING_MS : 직각이가 말하기 전 "…"을 보여주는 시간(1000 = 1초)
   · WRONG_LIMIT : 몇 번 틀리면 [정답 보고 넘어가기]가 나오는지
   · COLORS : 삼각형 색
   · MISSIONS : 미션별 대본
       title, sub : 목록에 보이는 이름 / formula : 증명할 목표(대화 위쪽에 계속 보임)
       intro : 미션을 시작할 때 직각이가 하는 말 ({ fig: {} }는 그림 말풍선 자리)
       end : 미션을 마칠 때 하는 말
       steps : 단계 목록. type은 세 가지입니다.
         - 'choice' : 보기 고르기. options(보기), answer(정답 보기 번호, 0부터 셈)
         - 'blank'  : 빈칸. template의 □ 자리 정답을 answer에.
                      cx와 xc, c×x처럼 같은 식은 자동으로 모두 정답 처리됩니다.
                      (입력에 쓸 수 있는 기호: a b c x y h ² × + ( ) )
         - 'essay'  : 서술. model(모범 답안)을 보여주고 학생이 스스로 점검
       hints : [1차 힌트, 2차 힌트]
       proof : 이 단계를 마치면 증명 카드에 쌓이는 한 줄
       hl : 그림 힌트 — tri(색칠할 삼각형), angles(표시할 각), sides(형광펜 칠할 변)
            각 이름은 가운데 글자가 꼭짓점('ABC' = ∠B). 변은 'BC'면 노랑, 'BC:ABC'면 △ABC 색.
            질문할 때는 기본 그림만 보내고, 한 번 틀리거나 [힌트]를 누르면 '그림 힌트'로 보냄
            (힌트 순서: 그림 힌트 → hints의 1차 → 2차)
       needs : 먼저 끝내야 열리는 미션 번호(0부터 셈)
   ※ 글 속의 소문자 a, b, c, x, y, h는 기울임 수학 문자로,
     두 글자 선분 이름(AB, BD …)은 선분 기호(윗줄)로 자동으로 바뀝니다.
   ===================================================================== */
const BOT_NAME = '직각이';
const TYPING_MS = { solo: 500, tv: 300 };
const WRONG_LIMIT = 2;

const COLORS = {
  ABC: '#2563eb', // 파랑
  DBA: '#ea7a17', // 주황
  DAC: '#16a34a', // 초록
};

const MISSIONS = [
  { // ───────────── 미션 1 ─────────────
    title: '미션 1', sub: '큰 삼각형과 왼쪽 삼각형',
    formula: 'a² = cx', basis: '△ABC ∽ △DBA',
    intro: [
      `안녕! 나는 ${BOT_NAME}야 📐`,
      '∠A = 90°인 직각삼각형 ABC에서 꼭짓점 A에서 빗변 BC에 내린 수선의 발을 D라고 할게.',
      { fig: {} },
      'AB = a, AC = b, BC = c, BD = x, CD = y, AD = h 로 놓고, a² = cx 임을 증명해 보자!',
    ],
    end: 'a² = cx 증명 완료! 🎉 완성된 증명을 공책에 옮겨 적어 봐.',
    steps: [
      { type:'choice', hl:{tri:['ABC','DBA']},
        q:'△ABC와 닮은 작은 삼각형 중 꼭짓점 B를 함께 가진 것은? (대응하는 꼭짓점 순서대로)',
        options:['△DBA','△BDA','△ABD','△DAC'], answer:0,
        hints:['△ABC의 꼭짓점 A, B, C에 각각 어느 꼭짓점이 대응하는지 생각해 봐.',
               'A(직각) ↔ D(직각), B ↔ B, C ↔ A 순서로 써야 해.'],
        proof:'△ABC와 △DBA에서' },
      { type:'choice', hl:{tri:['ABC','DBA'],angles:['ABC']},
        q:'두 삼각형에서 공통인 각은?',
        options:['∠A','∠B','∠C'], answer:1,
        hints:['두 삼각형이 함께 가진 꼭짓점을 찾아봐.',
               '꼭짓점 B의 각은 두 삼각형 모두에 들어 있어.'],
        proof:'∠B는 공통' },
      { type:'choice', hl:{tri:['ABC','DBA'],angles:['BAC','BDA']},
        q:'크기가 같은 직각의 짝은?',
        options:['∠BAC = ∠BDA = 90°','∠BAD = ∠BDA = 90°','∠ABD = ∠BAC = 90°'], answer:0,
        hints:['그림에서 직각 표시가 있는 곳을 찾아봐.',
               '△ABC의 직각은 ∠BAC, △DBA의 직각은 ∠BDA야.'],
        proof:'∠BAC = ∠BDA = 90°' },
      { type:'essay', hl:{tri:['ABC','DBA'],angles:['ABC','BAC','BDA']},

/* ---------- 글자 표시 ----------
   소문자 a,b,c,x,y,h → 기울임 수학 문자, ² → 위 첨자.
   한 글자씩 처리하는 이유: HTML 특수문자(&amp; 등)의 영문자를 잘못 바꾸지 않기 위해 */
function fmt(t) {
  let o = '';
  // ' : '가 줄 끝에서 끊기지 않게 붙는 공백으로
  const s = [...String(t).replace(/ : /g, '\u00a0:\u00a0')];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    // 두 글자 선분 이름(AB, BD …)에는 선분 기호(윗줄)를 붙인다.
    // △ABC·∠BAC처럼 더 긴 이름이나 'AA 닮음'의 AA는 건드리지 않는다.
    const pair = ch + (s[i + 1] || '');
    if (/^[A-D]{2}$/.test(pair) && pair !== 'AA' && !/[A-Z]/.test(s[i + 2] || '') && !/[A-Z△∠]/.test(s[i - 1] || '')) {
      o += `<span class="ol">${pair}</span>`; i++; continue;
    }
    if ('abcxyh'.includes(ch)) o += `<i class="v">${ch}</i>`;
    else if (ch === '²') o += '<sup>2</sup>';
    else if (ch === '<') o += '&lt;';
    else if (ch === '>') o += '&gt;';
    else if (ch === '&') o += '&amp;';
    else if (ch === '"') o += '&quot;';
    else o += ch;
  }
  return o;
}
function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- 채점: 식을 다항식으로 바꿔 비교 ----------
   cx, xc, c×x, c(x) 가 모두 같은 식으로 인정되도록
   문자 순서와 곱셈 기호를 무시하고 '같은 다항식인가'로 판정한다. */
function parsePoly(src) {
  const s = src.replace(/\s+/g, '').replace(/[·*]/g, '×').replace(/\^2/g, '²');
  let i = 0;
  const peek = () => s[i];
  const num = n => ({ '': n });
  const add = (p, q) => { const r = { ...p }; for (const k in q) r[k] = (r[k] || 0) + q[k]; return r; };
  const mul = (p, q) => {
    const r = {};
    for (const a in p) for (const b in q) {
      const k = (a + b).split('').sort().join('');
      r[k] = (r[k] || 0) + p[a] * q[b];
    }
    return r;
  };
  function expr() { let p = term(); while (peek() === '+') { i++; p = add(p, term()); } return p; }
  function term() {
    let p = factor();
    while (i < s.length) {
      if (peek() === '×') { i++; p = mul(p, factor()); }
      else if (/[abcxyh0-9(]/.test(peek())) p = mul(p, factor()); // 곱셈 기호 생략(cx)
      else break;
    }
    return p;
  }
  function factor() { let p = atom(); while (peek() === '²') { i++; p = mul(p, p); } return p; }
  function atom() {
    const ch = peek();
    if (ch === '(') { i++; const p = expr(); if (peek() !== ')') throw 0; i++; return p; }
    if (ch && 'abcxyh'.includes(ch)) { i++; return { [ch]: 1 }; }
    if (ch && /[0-9]/.test(ch)) { let n = ''; while (/[0-9]/.test(peek() || '')) n += s[i++]; return num(+n); }
    throw 0;
  }
  if (!s) throw 0;
  const p = expr();
  if (i !== s.length) throw 0;
  return p;
}
function samePoly(p, q) {
  const clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== 0));
  const a = clean(p), b = clean(q);
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => a[k] === b[k]);
}
/* 반환: true(정답) / false(오답) / null(식을 읽을 수 없음) */
function gradeBlank(input, answer) {
  let p;
  try { p = parsePoly(input); } catch (e) { return null; }
  return samePoly(p, parsePoly(answer));
}

   변 비율 3:4:5 (a=3, b=4, c=5 → x=1.8, y=3.2, h=2.4)로 확실히 기울어진 삼각형.
   이등변처럼 보이면 x=y로 착각하기 쉬워서 일부러 비대칭으로 그렸다. */
const P = { A: [184, 58], B: [40, 250], C: [440, 250], D: [184, 250] };
const RIGHT = ['BAC', 'BDA', 'ADC'];

function unit(from, to) {
  const dx = to[0] - from[0], dy = to[1] - from[1], L = Math.hypot(dx, dy);
  return [dx / L, dy / L];
}
function angleMark(name, color, opacity) {
  const V = P[name[1]], u1 = unit(V, P[name[0]]), u2 = unit(V, P[name[2]]);
  if (RIGHT.includes(name)) {
    const r = 16, p1 = [V[0] + u1[0]*r, V[1] + u1[1]*r], p3 = [V[0] + u2[0]*r, V[1] + u2[1]*r];
    const p2 = [p1[0] + u2[0]*r, p1[1] + u2[1]*r];
    return `<path d="M${V} L${p1} L${p2} L${p3} Z" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="1.6"/>`;
  }
  const r = 30, p1 = [V[0] + u1[0]*r, V[1] + u1[1]*r], p2 = [V[0] + u2[0]*r, V[1] + u2[1]*r];
  const sweep = (u1[0]*u2[1] - u1[1]*u2[0]) > 0 ? 1 : 0;
  return `<path d="M${V} L${p1} A${r} ${r} 0 0 ${sweep} ${p2} Z" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="1.6"/>`;
}
function drawFigure(hl = {}) {
  const tri = hl.tri || [], sides = hl.sides || [], angles = hl.angles || [];
  let s = `<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="직각삼각형 ABC 그림">`;
  // 1) 삼각형 색칠 (큰 삼각형을 먼저, 작은 삼각형을 위에)
  for (const t of ['ABC', 'DBA', 'DAC']) if (tri.includes(t)) {
    s += `<polygon points="${t.split('').map(k => P[k].join(',')).join(' ')}" fill="${COLORS[t]}" fill-opacity="${t === 'ABC' ? .13 : .26}"/>`;
  }
  // 2) 형광펜으로 변 강조
  //    'BC'      → 노란 형광펜
  //    'BC:ABC'  → 그 삼각형 색 형광펜. 먼저 나온 삼각형은 굵게, 다음 삼각형은 가늘게 위에 칠해서
  //               BC와 BD처럼 겹치는 변(또는 두 삼각형이 함께 쓰는 변)도 구별되게 한다.
  const triOrder = [];
  for (const sd of sides) { const t = sd.split(':')[1]; if (t && !triOrder.includes(t)) triOrder.push(t); }
  const sorted = [...sides].sort((u, v) => triOrder.indexOf(u.split(':')[1]) - triOrder.indexOf(v.split(':')[1]));
  for (const sd of sorted) {
    const [seg, t] = sd.split(':'), p = P[seg[0]], q = P[seg[1]];
    const color = t ? COLORS[t] : 'var(--marker)';
    const first = t && triOrder.indexOf(t) === 0;
    const w = t ? (first ? 18 : 9) : 13;
    const op = t ? (first ? .4 : .9) : .75;
    s += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  }
  // 3) 기본 직각 표시(회색) — 강조되지 않은 경우만
  for (const r of ['BAC', 'ADC']) if (!angles.includes(r)) s += angleMark(r, '#6b7280', 0);
  // 4) 강조한 각
  for (const a of angles) s += angleMark(a, 'var(--angle)', .28);
  // 5) 선분
  const seg = (a, b) => `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>`;
  s += seg('A','B') + seg('A','C') + seg('B','C') + seg('A','D');
  for (const k of 'ABCD') s += `<circle cx="${P[k][0]}" cy="${P[k][1]}" r="3" fill="#1f2328"/>`;
  // 6) 꼭짓점 이름
  const T = (x, y, t, extra = '') => `<text x="${x}" y="${y}" ${extra}>${t}</text>`;
  s += `<g font-family="Times New Roman,serif" font-size="22" fill="#1f2328" text-anchor="middle">`;
  s += T(184, 46, 'A') + T(24, 258, 'B') + T(458, 258, 'C') + T(184, 276, 'D');
  s += `</g>`;
  // 7) 길이 문자 (기울임)
  s += `<g font-family="Times New Roman,serif" font-style="italic" font-size="24" fill="#1d3fa8" text-anchor="middle">`;
  s += T(98, 146, 'a') + T(328, 146, 'b') + T(198, 176, 'h') + T(112, 276, 'x') + T(312, 276, 'y');
  // c는 BC 전체를 묶는 괄호 아래에
  s += `</g><path d="M40 288 v8 h400 v-8" fill="none" stroke="#1d3fa8" stroke-width="1.4"/>`;
  s += T(240, 316, 'c', 'font-family="Times New Roman,serif" font-style="italic" font-size="24" fill="#1d3fa8" text-anchor="middle"');
  s += `</svg>`;
  const legend = ['ABC', 'DBA', 'DAC'].filter(t => tri.includes(t))
    .map(t => `<span class="chip" style="background:${COLORS[t]}">△${t}</span>`).join('');
  return s + `<div class="legend">${legend}</div>`;
}

// 직각이 프로필: 직각삼각형 얼굴
const AVATAR = `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#14b8a6"/>
  <path d="M9 31 L9 9 L33 31 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M9 26 h5 v5" fill="none" stroke="#14b8a6" stroke-width="1.6"/>
  <circle cx="15" cy="21" r="1.8" fill="#1d2430"/><circle cx="21" cy="25" r="1.8" fill="#1d2430"/>
  <path d="M14.5 26.5 q2 2.6 4.4 1.4" stroke="#1d2430" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- 시작 화면 ---------- */
function isLocked(i) { return (MISSIONS[i].needs || []).some(n => !state.done.has(n)); }
function renderHome() {
  state.m = null; state.token++;
  const rooms = MISSIONS.map((m, i) => {
    const done = state.done.has(i), locked = isLocked(i);
    const st = done ? '✓ 완료' : locked ? '🔒 1·2 완료 후' : '<span class="badge">NEW</span>';
    return `<button class="room ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-m="${i}">
      <span class="av">${AVATAR}</span>
      <span class="mid"><div class="tt">${esc(m.title)} · ${esc(m.sub)}</div><div class="pv">${fmt(m.formula)} &nbsp;<small>${fmt(m.basis)}</small></div></span>
      <span class="st">${st}</span></button>`;
  }).join('');
  const allDone = state.done.size === MISSIONS.length;
  app.innerHTML = `<div class="home">
    <div class="homehead"><span class="av">${AVATAR}</span>
      <div><h1>직각삼각형 5공식</h1><p>${BOT_NAME}와 함께 증명해 보자!</p></div></div>
    <div class="figcard">${drawFigure({})}
      <div class="defs">${['AB = a','AC = b','BC = c','BD = x','CD = y','AD = h'].map(t => `<span>${fmt(t)}</span>`).join('')}</div></div>
    <div class="modes">
      <button data-mode="solo" class="${state.mode === 'solo' ? 'on' : ''}">개인 풀이</button>
      <button data-mode="tv" class="${state.mode === 'tv' ? 'on' : ''}">TV 시연</button>
    </div>
    <div class="rooms">${rooms}</div>
    ${allDone ? `<button class="sumbtn" id="sumBtn">정리 요약 보기</button>` : ''}
  </div>`;
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    state.mode = b.dataset.mode; document.body.classList.toggle('tv', isTV()); renderHome();
  });
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const i = +b.dataset.m;
    if (isLocked(i)) return alertModal('미션 1과 미션 2를 먼저 완료해 줘!');
    startMission(i);
  });
  const sb = document.getElementById('sumBtn'); if (sb) sb.onclick = showSummary;
  window.scrollTo(0, 0);
}

/* ---------- 대화 화면 ---------- */
function buildChat() {
  app.innerHTML = `<div class="chat">
    <div class="chathead">
      <button class="back" id="backBtn" aria-label="목록으로">←</button>
      <div class="t">${esc(M().title)} · ${fmt(M().formula)}</div>
      <div class="p" id="prog"></div>
      <button class="figbtn" id="figBtn">그림 📐</button>
    </div>
    <div class="chatbody">
      <div class="tvfig"><div class="in" id="tvfig"></div></div>
      <div class="chatcol"><div class="log" id="log"></div><div class="dock" id="dock"></div></div>
    </div></div>`;
  document.getElementById('backBtn').onclick = askLeave;
  document.getElementById('figBtn').onclick = () => modal(`<h2>그림</h2>${drawFigure(state.hl)}
    <div class="btns"><button class="btn pri" data-x>닫기</button></div>`, (ov, close) => ov.querySelector('[data-x]').onclick = close);
  fitViewport();
}
const logEl = () => document.getElementById('log');
const dockEl = () => document.getElementById('dock');
function scrollDown() { const l = logEl(); if (l) requestAnimationFrame(() => l.scrollTop = l.scrollHeight); }

/* 말풍선 붙이기. 카톡처럼 같은 사람이 연달아 말하면 프로필은 첫 말풍선에만 */
function lastSender() { const l = logEl(); const last = l && l.lastElementChild; return last ? last.dataset.who : null; }
function addMsg(who, html, cls = '') {
  const l = logEl(); if (!l) return null;
  const cont = lastSender() === who;
  const row = document.createElement('div');
  row.className = `msg ${who} ${cont ? 'cont' : ''}`;
  row.dataset.who = who;
  if (who === 'bot') {
    row.innerHTML = `<div class="avs">${cont ? '' : `<div class="av">${AVATAR}</div>`}</div>
      <div class="col">${cont ? '' : `<div class="name">${BOT_NAME}</div>`}<div class="bub ${cls}">${html}</div></div>`;
  } else {
    row.innerHTML = `<div class="col"><div class="bub ${cls}">${html}</div></div>`;
  }
  l.appendChild(row); scrollDown();
  return row;
}
function addUser(html) { addMsg('me', html); }

/* 직각이가 말하기: "…"을 잠깐 보여준 뒤 말풍선으로 바꾼다.
   items: 글자 / {fig:hl} / {html, cls} 를 차례대로 */
async function say(...items) {
  const tk = state.token;
  setBusy(true);
  for (const it of items) {
    if (it && it.fig) { // 그림 말풍선
      const hl = mergeHl(it.fig);
      setFigure(hl);
      if (sideFig()) continue;           // TV·가로 태블릿은 왼쪽 큰 그림만 바꾼다
      const key = JSON.stringify(hl);
      if (key === state.lastFigKey) continue; // 같은 그림이면 다시 안 보냄
      state.lastFigKey = key;
    }
    const typing = addMsg('bot', '<span class="typing"><i></i><i></i><i></i></span>');
    if (typing) typing.querySelector('.bub').style.padding = '0';
    await sleep(TYPING_MS[state.mode]);
    if (tk !== state.token) return false; // 그 사이 미션을 나갔으면 중단
    const bub = typing.querySelector('.bub');
    bub.style.padding = '';
    if (typeof it === 'string') bub.innerHTML = fmt(it);
    else if (it.fig) { bub.classList.add('fig'); bub.innerHTML = (it.caption ? `<div class="k">${it.caption}</div>` : '') + drawFigure(state.hl); }
    else { bub.innerHTML = it.html; if (it.cls) bub.className = 'bub ' + it.cls; }
    scrollDown();
  }
  setBusy(false);
  return tk === state.token;
}
function setBusy(b) { state.busy = b; const d = dockEl(); if (d) d.classList.toggle('busy', b); }
function mergeHl(h) { return { ...h }; }
function setFigure(hl) { state.hl = hl; const f = document.getElementById('tvfig'); if (f) f.innerHTML = drawFigure(hl); }
function setProgress() {
  const p = document.getElementById('prog');
  if (p) p.textContent = state.steps && !state.finished ? `${Math.min(state.s + 1, state.steps.length)}/${state.steps.length}` : '';
}

/* ---------- 진행 ---------- */
async function startMission(i) {
  state.m = i; state.token++; state.finished = false;
  state.steps = M().steps;
  state.s = 0; state.proof = []; state.lastFigKey = '';
  resetStep();
  buildChat(); setFigure(mergeHl({})); setProgress();
  dockEl().innerHTML = '';
  if (!await say(...M().intro)) return;
  askStep();
}
function resetStep() { state.wrong = 0; state.hint = 0; state.input = ''; state.essay = ''; state.wrongPicked = new Set(); state.figHint = false; }

/* 그림 강조(색칠한 삼각형·각·변)는 답을 알려주는 셈이라 질문할 때는 기본 그림만 보낸다.
   한 번 틀리거나 [힌트]를 누르면 '그림 힌트'로 보내고, 그다음 글 힌트로 넘어간다. */
function hasFigHint(st) { const h = st.hl || {}; return ['tri','angles','sides'].some(k => (h[k] || []).length); }
function figHintPending(st) { return hasFigHint(st) && !state.figHint; }
function figHintItems(st) {
  state.figHint = true;
  return sideFig() ? [{ fig: st.hl }, '왼쪽 그림에 힌트를 표시했어! 👈']
                : [{ fig: st.hl, caption: '💡 그림 힌트' }];
}
function confirmFigure(st) { if (sideFig()) setFigure(mergeHl(st.hl || {})); } // 옆 그림: 정답 뒤 확인용 강조
const curStep = () => state.steps[state.s];

async function askStep() {
  const st = curStep(); setProgress();
  if (!await say({ fig: {} }, st.q)) return; // 기본 그림만
  showStepDock();
}
function addProof(line) {
  if (line.startsWith('+') && state.proof.length) state.proof[state.proof.length - 1] += ' ' + line.slice(1).trim();
  else state.proof.push(line);
}
async function goNext() {
  state.s++; resetStep();
  if (state.s >= state.steps.length) return finishMission();
  askStep();
}
async function finishMission() {
  state.finished = true; state.done.add(state.m); setProgress();
  dockEl().innerHTML = '';
  const items = [];
  items.push(M().end, proofCard('완성된 증명', state.proof));
  if (!await say(...items)) return;
  const next = MISSIONS.findIndex((_, k) => !state.done.has(k) && !isLocked(k));
  const all = state.done.size === MISSIONS.length;
  dockEl().innerHTML = `<div class="btns">
    <button class="btn" data-home>목록으로</button>
    ${all ? `<button class="btn pri" data-sum>정리 요약 보기</button>`
      : next >= 0 ? `<button class="btn pri" data-next>${esc(MISSIONS[next].title)} 시작 →</button>` : ''}</div>`;
  const d = dockEl();
  d.querySelector('[data-home]').onclick = renderHome;
  const n = d.querySelector('[data-next]'); if (n) n.onclick = () => startMission(next);
  const s = d.querySelector('[data-sum]'); if (s) s.onclick = () => { renderHome(); showSummary(); };
}
function proofCard(title, lines) {
  return { cls: 'wide card', html: `<div class="ct">📝 ${esc(title)}</div><ol>${lines.map(l => `<li>${fmt(l)}</li>`).join('')}</ol>` };
}

/* ---------- 입력 영역(단계 유형별) ---------- */
function showStepDock() {
  const st = curStep();
  if (st.type === 'choice') return dockChoice(st);
  if (st.type === 'blank') return dockBlank(st);
  return dockEssay(st);
}
function extraButtons(st) { // 힌트 / 정답 보기
  let b = '';
  const more = figHintPending(st) || (st.hints && state.hint < st.hints.length);
  const shown = state.figHint || state.hint > 0;
  if (more) b += `<button class="btn" data-hint>힌트${shown ? ' 더' : ''} 💡</button>`;
  if (isTV()) b += `<button class="btn" data-reveal>정답 공개</button>`;
  else if (state.wrong >= WRONG_LIMIT) b += `<button class="btn" data-reveal>정답 보고 넘어가기</button>`;
  return b;
}
function bindExtra(st) {
  const d = dockEl();
  const h = d.querySelector('[data-hint]'); if (h) h.onclick = () => giveHint(st);
  const r = d.querySelector('[data-reveal]'); if (r) r.onclick = () => reveal(st);
}

function dockChoice(st) {
  const ex = extraButtons(st);
  dockEl().innerHTML = `<div class="opts">${st.options.map((o, i) =>
      `<button class="opt ${state.wrongPicked.has(i) ? 'wrong' : ''}" data-opt="${i}">${fmt(o)}</button>`).join('')}</div>
    ${ex ? `<div class="btns">${ex}</div>` : ''}`;
  dockEl().querySelectorAll('[data-opt]').forEach(b => b.onclick = () => pickOption(st, +b.dataset.opt));
  bindExtra(st);
}
async function pickOption(st, i) {
  if (state.busy || state.wrongPicked.has(i)) return;
  addUser(fmt(st.options[i]));
  if (i === st.answer) {
    addProof(st.proof); confirmFigure(st);
    if (!await say({ html: '정답! 👍' + (st.after ? '<br>' + fmt(st.after) : ''), cls: 'ok' })) return;
    goNext();
  } else {
    state.wrong++; state.wrongPicked.add(i);
    const extra = figHintPending(st) ? figHintItems(st) : [];
    if (!await say(wrongText(st, extra.length > 0), ...extra)) return;
    dockChoice(st);
  }
}
function wrongText(st, withFig) {
  if (withFig && !sideFig()) return '음… 다시 생각해 볼까? 🤔 그림에 힌트를 표시했어.';
  if (isTV()) return '음… 다시 생각해 볼까? 🤔';
  if (state.wrong >= WRONG_LIMIT) return '아직 아니야. 힌트를 보거나, 정답을 보고 넘어가도 괜찮아.';
  return '음… 다시 생각해 볼까? 🤔 막히면 힌트를 눌러 봐.';
}

function dockBlank(st) {
  const [pre, post] = st.template.split('□');
  const ex = extraButtons(st);
  dockEl().innerHTML = `
    <div class="preview">${fmt(pre)}<span class="box ${state.input ? 'on' : ''}">${fmt(state.input)}<span class="caret"></span></span>${fmt(post || '')}</div>
    <div class="keys">${['a','b','c','x','y','h','²','×','+','(',')','⌫'].map(k =>
      `<button class="key ${'abcxyh'.includes(k) ? 'lt' : 'fn'}" data-key="${k}">${k}</button>`).join('')}</div>
    <div class="btns">${ex}<button class="btn pri" data-send>보내기</button></div>`;
  dockEl().querySelectorAll('[data-key]').forEach(b => b.onclick = () => pressKey(b.dataset.key));
  dockEl().querySelector('[data-send]').onclick = () => sendBlank(st);
  bindExtra(st);
}
function pressKey(k) {
  if (state.busy) return;
  if (k === '⌫') state.input = [...state.input].slice(0, -1).join('');
  else if (state.input.length < 16) state.input += k;
  dockBlank(curStep());
}
async function sendBlank(st) {
  if (state.busy) return;
  if (!state.input) return say('답을 입력해 줘! ✍️');
  const filled = st.template.replace('□', state.input);
  addUser(fmt(filled));
  const r = gradeBlank(state.input, st.answer);
  if (r === null) { // 식으로 읽을 수 없으면 오답으로 세지 않는다
    if (!await say('식을 읽을 수 없어. 괄호나 기호를 확인해 줘! 🧐')) return;
    return dockBlank(st);
  }
  if (r) {
    addProof(st.proof); confirmFigure(st);
    if (!await say({ html: '정답! 👍' + (st.after ? '<br>' + fmt(st.after) : ''), cls: 'ok' })) return;
    goNext();
  } else {
    state.wrong++; state.input = '';
    const extra = figHintPending(st) ? figHintItems(st) : [];
    if (!await say(wrongText(st, extra.length > 0), ...extra)) return;
    dockBlank(st);
  }
}

function dockEssay(st) {
  if (isTV()) { // TV: 말로 답하고 모범 답안만 공개
    dockEl().innerHTML = `<div class="btns"><button class="btn pri" data-model>모범 답안 보기</button></div>`;
    dockEl().querySelector('[data-model]').onclick = async () => {
      addProof(st.proof); confirmFigure(st);
      if (!await say(modelBubble(st.model))) return;
      dockEl().innerHTML = `<div class="btns"><button class="btn pri" data-next>다음 →</button></div>`;
      dockEl().querySelector('[data-next]').onclick = goNext;
    };
    return;
  }
  dockEl().innerHTML = `<textarea id="essay" rows="2" placeholder="이유를 써 보세요">${esc(state.essay)}</textarea>
    <div class="btns"><button class="btn pri" data-send>보내기</button></div>`;
  wireTextarea();
  dockEl().querySelector('[data-send]').onclick = async () => {
    if (state.busy) return;
    if (!state.essay.trim()) return say('답을 입력해 줘! ✍️');
    addUser(esc(state.essay));
    if (!await say('모범 답안이야. 네 답과 비교해 봐! 핵심 근거가 다 들어 있니?', modelBubble(st.model))) return;
    dockEl().innerHTML = `<div class="btns"><button class="btn" data-retry>다시 쓸게요</button><button class="btn ok" data-ok>맞게 썼어요 →</button></div>`;
    dockEl().querySelector('[data-retry]').onclick = () => { addUser('다시 쓸게요'); dockEssay(st); };
    dockEl().querySelector('[data-ok]').onclick = async () => {
      addUser('맞게 썼어요!'); addProof(st.proof);
      if (!await say({ html: '좋아! 👏', cls: 'ok' })) return;
      goNext();
    };
  };
}
function modelBubble(t) { return { cls: 'model', html: `<div class="k">모범 답안</div>${fmt(t)}` }; }
function wireTextarea() {
  const ta = document.getElementById('essay');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ta.oninput = () => { state.essay = ta.value; grow(); };
  ta.onfocus = () => setTimeout(scrollDown, 300); // 키보드가 올라온 뒤 맨 아래로
  grow();
}

async function giveHint(st) {
  if (state.busy) return;
  addUser('힌트 줘!');
  if (figHintPending(st)) { // 그림 힌트부터
    if (!await say(...figHintItems(st))) return;
    return showStepDock();
  }
  const t = st.hints[state.hint++];
  if (!await say({ cls: 'hint', html: `<div class="k">💡 힌트 ${state.hint}</div>${fmt(t)}` })) return;
  showStepDock();
}
async function reveal(st) {
  if (state.busy) return;
  addUser(isTV() ? '정답 공개!' : '정답 알려줘');
  const ans = st.type === 'choice' ? st.options[st.answer] : st.template.replace('□', st.answer);
  addProof(st.proof); confirmFigure(st);
  if (!await say({ html: `정답은 <b>${fmt(ans)}</b> 이야.` + (st.after ? '<br>' + fmt(st.after) : ''), cls: 'ok' })) return;
  goNext();
}

/* ---------- 팝업 ---------- */
function modal(html, bind) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  bind(ov, () => ov.remove());
}
function alertModal(t) {
  modal(`<p style="margin:4px 0 14px">${esc(t)}</p><div class="btns"><button class="btn pri" data-x>확인</button></div>`,
    (ov, close) => ov.querySelector('[data-x]').onclick = close);
}
function askLeave() {
  if (state.finished) return renderHome();
  modal(`<h2>목록으로 나갈까요?</h2><p>지금까지의 대화가 사라져요. 다시 들어오면 처음부터 시작해요.</p>
    <div class="btns"><button class="btn" data-x>계속 풀기</button><button class="btn pri" data-go>나가기</button></div>`,
    (ov, close) => { ov.querySelector('[data-x]').onclick = close; ov.querySelector('[data-go]').onclick = () => { close(); renderHome(); }; });
}
function showSummary() {
  modal(`<h2>📌 정리</h2><div class="sum">${SUMMARY.map(r => `<div><div class="f">${fmt(r.f)}</div><div class="s">${fmt(r.s)}</div></div>`).join('')}</div>
    ${drawFigure({})}
    <div class="btns"><button class="btn pri" data-x>닫기</button></div>`,
    (ov, close) => ov.querySelector('[data-x]').onclick = close);
}

/* ---------- 아이폰 키보드 대응 ----------
   아이폰 사파리는 키보드가 올라와도 화면 높이를 줄이지 않아 입력창이 가려진다.
   보이는 영역(visualViewport)의 높이에 대화 화면을 맞춘다. */
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (state.m !== null) window.scrollTo(0, 0);
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => { fitViewport(); scrollDown(); });
  visualViewport.addEventListener('scroll', fitViewport);
}
window.addEventListener('resize', fitViewport);

/* PC 키보드(교실 TV 시연용): 빈칸 단계에서 a b c x y h, 2 또는 ^ → ², * → ×, Backspace, Enter */
document.addEventListener('keydown', e => {
  if (state.m === null || !state.steps || state.finished || document.querySelector('.overlay')) return;
  if (e.target.tagName === 'TEXTAREA') return;
  const st = curStep(); if (!st || st.type !== 'blank') return;
  const map = { Backspace: '⌫', '^': '²', '2': '²', '*': '×', '+': '+', '(': '(', ')': ')' };
  const low = e.key.length === 1 ? e.key.toLowerCase() : '';
  const k = map[e.key] || ('abcxyh'.includes(low) && low ? low : null);
  if (k) { e.preventDefault(); pressKey(k); }
  else if (e.key === 'Enter') { e.preventDefault(); sendBlank(st); }
});

renderHome();
</script>
